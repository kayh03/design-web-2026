<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Atividade - Card Tailwind</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- Card -->
    <div class="max-w-sm rounded shadow p-4 bg-white border">

        <!-- Imagem -->
        <img
            src="https://placehold.co/400x200"
            alt="Imagem ilustrativa"
            class="w-full rounded"
        />

        <!-- Título -->
        <h2 class="text-2xl font-bold text-gray-800 mt-4">
            Meu primeiro cartão
        </h2>

        <!-- Descrição -->
        <p class="text-gray-600 mt-2">
            Este é um cartão criado utilizando classes do Tailwind CSS.
            Nele podemos combinar imagem, título, descrição e botão.
        </p>

        <!-- Botão -->
        <button
            class="bg-blue-500 text-white px-4 py-2 rounded mt-4 hover:bg-blue-700"
        >
            Saiba mais
        </button>

    </div>

</body>

</html>
