<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Prática Tailwind - Dia 2 [Atividade 1]</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

  <!-- Card da notícia -->
  <div class="max-w-sm mx-auto mt-10 bg-white rounded-xl shadow-md overflow-hidden border border-green-200">

    <!-- Imagem -->
    <img
      src="premio.jpg"
      alt="Troféu de premiação"
      class="w-full h-48 object-cover"
    />

    <!-- Conteúdo -->
    <div class="p-6 space-y-3">
        https://pixabay.com/pt/images/search/premiacao/
      <!-- Título -->
      <h2 class="text-2xl font-bold text-green-800">
        IFRN tem projetos entre os vencedores do Prêmio IEL 2026
      </h2>

      <!-- Descrição -->
      <p class="text-gray-700 text-base">
        Instituto conquistou o 1º lugar em Educação Inovadora -
        Nível Técnico e o 2º lugar em Educação Inovadora -
        Nível Superior.
      </p>

      <div class="flex flex-wrap gap-2 pt-2">

        <span class="bg-green-200 text-green-800 px-3 py-1 rounded-full text-sm font-semibold">
          1º lugar - Nível Técnico
        </span>

        <span class="bg-green-200 text-green-800 px-3 py-1 rounded-full text-sm font-semibold">
          2º lugar - Nível Superior
        </span>

      </div>

    </div>
  </div>

</body>
</html>
